name: Verify AgriStore
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run audit:dependencies
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm run build
      - name: Install test browser
        run: bash scripts/install-test-browser.sh
        timeout-minutes: 6
      - run: npm run test:e2e
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npx supabase db lint --local --level warning --fail-on warning
      - run: npm run test:db
      - run: npm run test:restore
      - name: Install test browser
        run: bash scripts/install-test-browser.sh
        timeout-minutes: 6
      - run: npm run test:integration
      - name: Test enabled workflows with the fixed Magpet branch setup
        run: npm run test:magpet
      - name: Retain synthetic Magpet pilot review captures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: magpet-pilot-review
          path: test-results/*.png
          retention-days: 3
      - run: npx supabase stop --no-backup
        if: always()
